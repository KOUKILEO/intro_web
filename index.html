<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My First Static Website</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #f7f7f7, #dfe9f3);
      text-align: center;
    }

    .page {
      width: 90%;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 0;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 25px;
    }

    .image-animation {
      position: relative;
      width: 650px;
      max-width: 95vw;
      height: 380px;
      margin: 0 auto 35px;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      background: #000;
    }

    .half-wrap {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      overflow: hidden;
      z-index: 2;
      animation-duration: 5s;
      animation-fill-mode: forwards;
      animation-timing-function: ease-in-out;
    }

    .left-wrap {
      left: 0;
      transform: translateX(-100%);
      animation-name: leftMerge;
    }

    .right-wrap {
      right: 0;
      transform: translateX(100%);
      animation-name: rightMerge;
    }

    .first-image {
      position: absolute;
      top: 0;
      width: 200%;
      height: 100%;
      object-fit: cover;
    }

    .left-wrap .first-image {
      left: 0;
    }

    .right-wrap .first-image {
      right: 0;
    }

    .second-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;

      /* 這裡控制第二張圖的位置 */
      object-position: center 65%;

      opacity: 0;
      transform: scale(1.08);
      z-index: 1;
      animation: showSecond 5s ease-in-out forwards;
    }

    @keyframes leftMerge {
      0% {
        transform: translateX(-100%);
        opacity: 1;
      }

      55% {
        transform: translateX(0);
        opacity: 1;
      }

      75% {
        transform: translateX(0);
        opacity: 1;
      }

      100% {
        transform: translateX(0);
        opacity: 0;
      }
    }

    @keyframes rightMerge {
      0% {
        transform: translateX(100%);
        opacity: 1;
      }

      55% {
        transform: translateX(0);
        opacity: 1;
      }

      75% {
        transform: translateX(0);
        opacity: 1;
      }

      100% {
        transform: translateX(0);
        opacity: 0;
      }
    }

    @keyframes showSecond {
      0% {
        opacity: 0;
        transform: scale(1.08);
      }

      65% {
        opacity: 0;
        transform: scale(1.08);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    iframe {
      max-width: 100%;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    h2 {
      margin-top: 25px;
      font-size: 26px;
    }

    button {
      margin-top: 20px;
      padding: 12px 32px;
      font-size: 18px;
      border: none;
      border-radius: 999px;
      background: #111;
      color: white;
      cursor: pointer;
      transition: 0.25s;
    }

    button:hover {
      transform: translateY(-3px);
      background: #333;
    }

    hr {
      margin-top: 35px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }

      .image-animation {
        width: 95vw;
        height: 260px;
      }

      h2 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <h1>Hello, 二百五!</h1>

    <div class="image-animation">

      <!-- 左半邊第一張圖 -->
      <div class="half-wrap left-wrap">
        <img
          class="first-image"
          src="https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcQGvnnlbvqTxILHhi-nXJrBFDS45_AqhCDOuwJtt-XBwYphGxHQ"
          alt="第一張圖左半"
        />
      </div>

      <!-- 右半邊第一張圖 -->
      <div class="half-wrap right-wrap">
        <img
          class="first-image"
          src="https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcQGvnnlbvqTxILHhi-nXJrBFDS45_AqhCDOuwJtt-XBwYphGxHQ"
          alt="第一張圖右半"
        />
      </div>

      <!-- 第二張圖 -->
      <img
        class="second-image"
        src="https://pic.upmedia.mg/uploads/ck/X231CV6X5G7.webp"
        alt="第二張圖"
      />
    </div>

    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/x-pCAngjeOw?si=vt6usCXWC47zM-V8"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>

    <h2>This will be the homepage for this website!</h2>

    <button>Login</button>

    <hr>
  </div>
</body>
</html>
